x-core-service: &core-service
  networks: [ fpm-net ]
  profiles:
    - core
    - mgr-components
    - app-platform-minimal

###########################################
####---- Infrastructure containers ----####
###########################################
services:
  db:
    <<: *core-service
    container_name: db
    image: postgres:16-alpine
    networks: [ fpm-net ]
    profiles:
      - core
      - mgr-components
      - app-platform-minimal
    environment:
      PGUSER: postgres
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OKAPI_DB_PASSWORD: ${OKAPI_DB_PASSWORD}
      MGR_APPLICATIONS_DB_PASSWORD: ${MGR_APPLICATIONS_DB_PASSWORD}
      MGR_TENANTS_DB_PASSWORD: ${MGR_TENANTS_DB_PASSWORD}
      MGR_TENANT_ENTITLEMENTS_DB_PASSWORD: ${MGR_TENANT_ENTITLEMENTS_DB_PASSWORD}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KONG_DB_PASSWORD: ${KONG_DB_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 10s
      retries: 10

  zookeeper:
    <<: *core-service
    container_name: zookeeper
    image: zookeeper
    ports:
      - "2181:2181"
    healthcheck:
      test: nc -z localhost 2181 || exit -1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 5s

  kafka:
    <<: *core-service
    container_name: kafka
    image: wurstmeister/kafka:2.13-2.8.1
    restart: on-failure
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INSIDE://:9091,OUTSIDE://:9092
      KAFKA_ADVERTISED_LISTENERS: INSIDE://:9091,OUTSIDE://kafka:9092
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_MESSAGE_MAX_BYTES: 1000000
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka-data:/kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9092'" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  vault:
    <<: *core-service
    container_name: vault
    image: folio-vault:1.13.3
    volumes:
      - vault-data:/vault/data:rw
    cap_add: [ IPC_LOCK ]
    ports:
      - "8200:8200"
    healthcheck:
      test: [ "CMD", "vault", "status" ]
      interval: 5s
      timeout: 10s
      retries: 30
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}
      KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET}

  api-gateway:
    <<: *core-service
    container_name: api-gateway
    image: ${FOLIO_KONG_IMAGE}
    restart: on-failure
    # Use the image's native /entrypoint.sh (shipped by folio-kong): it runs the
    # kong migrations, sets up CORS (wildcard by default; override with the
    # CORS_ORIGINS env var), and applies the bundled deck config. We intentionally
    # do NOT override it — a local fork drifts from upstream and silently drops new
    # setup steps (this is exactly what broke the DECK_CORS_ORIGINS handling).
    command:
      - kong
      - docker-start
    environment:
      KONG_DATABASE: postgres
      KONG_PG_DATABASE: kong
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: 4 200k
      KONG_PG_HOST: db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong_rw
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_PLUGINS: bundled
      KONG_LOG_LEVEL: debug
      ENV: local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8443:8443"
      - "8444:8444"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8001/status >/dev/null || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    <<: *core-service
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 9080:8080
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_JMXPORT: 9997

networks:
  fpm-net:
    name: folio-platform-minimal
    driver: bridge

volumes:
  db: { }
  vault-data: { }
  kafka-data: { }
