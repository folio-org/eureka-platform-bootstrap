x-ui-service: &ui-service
  networks: [ fpm-net ]
  profiles:
    - ui

###########################################
####---- FOLIO UI Service          ----####
###########################################
services:
  folio-ui:
    <<: *ui-service
    container_name: folio-ui
    image: ${FOLIO_UI_IMAGE:-folioci/folio-ui:latest}
    environment:
      KONG_URL: http://localhost:8000
      KEYCLOAK_URL: http://localhost:8080
      PLATFORM_COMPLETE_URL: http://localhost:3000
      IS_SINGLE_TENANT: true
      HAS_ALL_PERMS: false
      ENABLE_ECS_REQUESTS: false
      KC_LOGIN_CLIENT_SUFFIX: ${KC_LOGIN_CLIENT_SUFFIX:--login-app}
    # Note: api-gateway and keycloak should be running from core profile
    # No explicit depends_on since they're in a different profile
    ports:
      - "${UI_PORT:-3000}:80"
    deploy:
      resources:
        limits:
          memory: ${UI_MEMORY_LIMIT:-128m}
        reservations:
          memory: 64m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  fpm-net:
    name: folio-platform-minimal
