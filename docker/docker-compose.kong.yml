###################################################
####---- Kong API Gateway (APIGW_TYPE=kong) ----####
###################################################
#
# Included via COMPOSE_FILE when APIGW_TYPE=kong (the default).
# The api-gateway service is intentionally kept in its own file so that the
# APISIX alternative (docker-compose.apisix.yml) can use the same container
# name without a Compose-level conflict — only one file is active at a time.
#
# The profile gw-kong is activated by the bootstrap alongside --profile core,
# so all infrastructure services (db, kafka, vault, keycloak) start first and
# the gateway joins them in the same up call.

x-gateway-env: &gateway-env
  APIGW_TYPE: kong
  APIGW_URL: http://api-gateway:8001

services:
  api-gateway:
    container_name: api-gateway
    image: ${FOLIO_KONG_IMAGE}
    restart: on-failure
    # Use the image's native /entrypoint.sh (shipped by folio-kong): it runs the
    # kong migrations, sets up CORS (wildcard by default; override with the
    # CORS_ORIGINS env var), and applies the bundled deck config. We intentionally
    # do NOT override it — a local fork drifts from upstream and silently drops new
    # setup steps (this is exactly what broke the DECK_CORS_ORIGINS handling).
    command:
      - kong
      - docker-start
    environment:
      KONG_DATABASE: postgres
      KONG_PG_DATABASE: kong
      KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS: 4 200k
      KONG_PG_HOST: db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong_rw
      KONG_PG_PASSWORD: ${KONG_DB_PASSWORD}
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_PLUGINS: bundled
      KONG_LOG_LEVEL: debug
      ENV: local
    depends_on:
      db:
        condition: service_healthy
    networks: [ fpm-net ]
    profiles:
      - gw-kong
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
      - "8443:8443"
      - "8444:8444"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8001/status >/dev/null || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  mgr-applications:
    environment:
      <<: *gateway-env
  mgr-tenants:
    environment:
      <<: *gateway-env
  mgr-tenant-entitlements:
    environment:
      <<: *gateway-env
