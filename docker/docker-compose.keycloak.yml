x-keycloak-service: &keycloak-service
  image: ${FOLIO_KEYCLOAK_IMAGE}
  networks: [ fpm-net ]
  environment:
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
    KC_FOLIO_BE_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID:-folio-backend-admin-client}
    KC_FOLIO_BE_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:-folio-backend-admin-client-secret}
    KC_DB_URL_HOST: db
    KC_DB_URL_PORT: 5432
    KC_DB_URL_DATABASE: keycloak
    KC_DB_USERNAME: keycloak_rw
    KC_DB_PASSWORD: ${KC_DB_PASSWORD:-keycloak_admin}
    KC_PROXY: edge
    KC_HOSTNAME: localhost
    KC_HOSTNAME_PORT: 8080
    KC_HTTP_ENABLED: "true"
    KC_HEALTH_ENABLED: "true"
    KC_HTTP_MANAGEMENT_SCHEME: http
    KC_HOSTNAME_STRICT: "false"
    KC_HOSTNAME_STRICT_HTTPS: "false"
    JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=85.0"
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
    interval: 30s
    timeout: 5s
    retries: 20
  deploy:
    resources:
      limits:
        cpus: 1.0
        memory: 1200m
      reservations:
        cpus: 1.0
        memory: 1200m

#############################################
####---- Keycloak cluster containers ----####
#############################################
#
# Default topology: a single Keycloak node (keycloak-s0) behind the `keycloak`
# nginx load balancer. To scale the cluster, do two small edits and rerun:
#   1. Uncomment the keycloak-sN service block(s) below.
#   2. Uncomment the matching `server keycloak-sN ...` lines in
#      docker/nginx/keycloak-nginx.conf (both the `kc` and `kc_health` upstreams).
#   3. (Optional) add `keycloak-sN: { condition: service_healthy }` to the
#      `keycloak` service depends_on so the LB waits for the new node.
# No script changes are needed: health waiting in start.sh is dynamic and adapts
# to however many nodes are running.
services:
  keycloak:
    container_name: keycloak
    networks: [ fpm-net ]
    image: nginx
    profiles:
      - core
      - mgr-components
      - app-platform-minimal
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
      keycloak-s0:
        condition: service_healthy
#      keycloak-s1:
#        condition: service_healthy
#      keycloak-s2:
#        condition: service_healthy
    volumes:
      - ./nginx/keycloak-nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://keycloak:8080/realms/master || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 15


  keycloak-s0:
    <<: *keycloak-service
    container_name: keycloak-s0
    profiles:
      - core
      - mgr-components
      - app-platform-minimal
    ports:
      - "18081:8080"

