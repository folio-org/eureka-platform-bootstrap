x-folio-module-env: &folio-module-env
  ENV: folio
  DB_HOST: db
  DB_PORT: 5432
  DB_DATABASE: okapi
  DB_USERNAME: okapi_rw
  DB_PASSWORD: ${OKAPI_DB_PASSWORD}
  JAVA_OPTIONS: "-Dokapi.url=${OKAPI_URL} -Djdk.internal.httpclient.disableHostnameVerification=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -XX:MaxRAMPercentage=80.0"
  KAFKA_HOST: kafka
  KAFKA_PORT: 9092
  OKAPI_URL: ${OKAPI_URL}
  KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}

x-folio-module: &folio-module
  networks: [ fpm-net ]
  deploy:
    resources:
      limits:
        memory: 384m
      reservations:
        memory: 256m
  # Native readiness signal for the backend module itself (the sidecar only
  # reports its own health, not the module's). This lets wait_for_all_healthy
  # gate on real module readiness instead of a host-port poll.
  healthcheck:
    test: [ "CMD-SHELL", "wget -q --spider http://localhost:8081/admin/health || exit 1" ]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 30s
  # Modules need the database up before they can initialise. Kafka is not
  # required at startup (modules tolerate a late broker), so it is omitted.
  depends_on:
    db:
      condition: service_healthy
  environment:
    <<: *folio-module-env

x-vault-env: &vault-env
  SECRET_STORE_TYPE: ${SECRET_STORE_TYPE}
  SECRET_STORE_VAULT_TOKEN: ${SECRET_STORE_VAULT_TOKEN}
  SECRET_STORE_VAULT_ADDRESS: ${SECRET_STORE_VAULT_ADDRESS}

##############################################
####---- app-platform-minimal modules ----####
##############################################
services:
  mod-users:
    <<: *folio-module
    container_name: mod-users
    image: ${MOD_USERS_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9001:8081"
      - "10001:5005"

  mod-configuration:
    <<: *folio-module
    container_name: mod-configuration
    image: ${MOD_CONFIGURATION_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9002:8081"
      - "10002:5005"

  mod-permissions:
    <<: *folio-module
    container_name: mod-permissions
    image: ${MOD_PERMISSIONS_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9003:8081"
      - "10003:5005"

  mod-tags:
    <<: *folio-module
    container_name: mod-tags
    image: ${MOD_TAGS_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9004:8081"
      - "10004:5005"

  mod-users-bl:
    <<: *folio-module
    container_name: mod-users-bl
    image: ${MOD_USERS_BL_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9005:8081"
      - "10005:5005"

  mod-password-validator:
    <<: *folio-module
    container_name: mod-password-validator
    image: ${MOD_PASSWORD_VALIDATOR_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9007:8081"
      - "10007:5005"

  mod-notes:
    <<: *folio-module
    container_name: mod-notes
    image: ${MOD_NOTES_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9008:8081"
      - "10008:5005"

  mod-users-keycloak:
    <<: *folio-module
    container_name: mod-users-keycloak
    image: ${MOD_USERS_KEYCLOAK_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9009:8081"
      - "10009:5005"
    environment:
      <<: [ *folio-module-env, *vault-env ]
      KC_URL: http://keycloak:8080
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}
      KC_LOGIN_CLIENT_SUFFIX: ${KC_LOGIN_CLIENT_SUFFIX}
      INCLUDE_ONLY_VISIBLE_PERMISSIONS: false
      JAVA_OPTIONS: >-
        -Dhost=okapi
        -Dstorage=postgres
        -Dpostgres_host=db
        -Dpostgres_username=okapi_rw
        -Dpostgres_password=${OKAPI_DB_PASSWORD}
        -Dokapi.url=http://sc-users-keycloak:8081
        -Djdk.internal.httpclient.disableHostnameVerification=true
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -XX:MaxRAMPercentage=70.0

  mod-login-keycloak:
    <<: *folio-module
    container_name: mod-login-keycloak
    image: ${MOD_LOGIN_KEYCLOAK_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9010:8081"
      - "10010:5005"
    environment:
      <<: [ *folio-module-env, *vault-env ]
      KC_URL: http://keycloak:8080
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}
      KC_LOGIN_CLIENT_SUFFIX: ${KC_LOGIN_CLIENT_SUFFIX}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_ADMIN_TOKEN_TTL: 55s
      LOGIN_COOKIE_SAMESITE: LAX
      X_OKAPI_TOKEN_HEADER_ENABLED: true

  mod-roles-keycloak:
    <<: *folio-module
    container_name: mod-roles-keycloak
    image: ${MOD_ROLES_KEYCLOAK_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9011:8081"
      - "10011:5005"
    environment:
      <<: [ *folio-module-env, *vault-env ]
      KC_URL: http://keycloak:8080
      KC_ADMIN_CLIENT_ID: ${KC_ADMIN_CLIENT_ID}
      KC_LOGIN_CLIENT_SUFFIX: ${KC_LOGIN_CLIENT_SUFFIX}

  mod-settings:
    <<: *folio-module
    container_name: mod-settings
    image: ${MOD_SETTINGS_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9012:8081"
      - "10012:5005"

  mod-scheduler:
    <<: *folio-module
    container_name: mod-scheduler
    image: ${MOD_SCHEDULER_IMAGE}
    profiles: [ app-platform-minimal ]
    ports:
      - "9020:8081"
      - "10020:5005"
    environment:
      <<: [ *folio-module-env, *vault-env ]
      JAVA_OPTIONS: >-
        -Dokapi.url=http://api-gateway:8000
        -Djdk.internal.httpclient.disableHostnameVerification=true
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
        -XX:MaxRAMPercentage=70.0
